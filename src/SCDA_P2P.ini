; SCDA P2P settings. The launcher fills most of this in for you.
[P2P]
; 0 = dinput8.dll does nothing (plain passthrough)
Enabled=1
; IPv4 address the game must use. Written by the launcher each time you press PLAY.
PreferredIP=
; Used when PreferredIP is empty or not found: first adapter whose name contains this text.
AdapterMatch=ZeroTier
; Optional: other players' ZeroTier IPs, comma separated. Not normally needed - the LAN
; search is already sent to every address in the ZeroTier network's range.
Peers=
; Log a per-player traffic summary (STATS lines in SCDA_P2P.log) every N seconds. 0 = off.
StatsSeconds=5
; The game's anti-cheat calls a player a cheater if nothing arrives from them for 7 s (slow map
; load, lag). Seconds to allow instead; only the host's value counts. 0 = game default.
CheatTimeoutSeconds=60

[Controller]
; 1 = read Xbox/XInput controllers through the mod (triggers usable as buttons). 0 = off.
XInput=1
; 1 = if Windows' DirectInput doesn't list your controller (some ROG/third-party/wireless pads),
; give the game a virtual one read from XInput. 2 = always when DirectInput lists none, 0 = never.
VirtualPad=1
; 1 = full speed when the movement stick is pushed diagonally (round stick stretched to a square,
; as the game expects). 0 = raw stick. StickDeadZone = movement stick dead zone in percent.
SquareStick=1
StickDeadZone=8

[Updates]
; 1 = the launcher checks GitHub for a newer version of the mod when it opens.
CheckOnStart=1

[Launcher]
NetworkID=
CloseZeroTierApp=1
